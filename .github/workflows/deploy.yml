name: Test e deploy su Cloudflare

# Test e build a ogni PR; a ogni push su main pubblica dist/ sul Worker "sbeggio" (wrangler.jsonc),
# servito su https://sbeggio.app. Serve il secret CLOUDFLARE_API_TOKEN (modello "Edit Cloudflare Workers").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.147.0'
          command: deploy
