name: App Android

# Costruisce l'APK dell'app (Capacitor). Con un tag di versione (1.8.0 o v1.8.0) lo allega alla
# release di GitHub, anche con il nome fisso krumiro.apk per il link di download permanente.
on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/native/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # serve solo per allegare l'APK alla release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Il predefinito include il pacchetto `tools`, che non esiste più nell'SDK recente.
          # Piattaforma e build-tools li scarica Gradle quando servono.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Versione dell'app
        id: versione
        run: echo "numero=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Con i secret KRUMIRO_KEYSTORE_BASE64 e KRUMIRO_KEYSTORE_PASSWORD l'APK è firmato sempre con
      # la stessa chiave, quindi ogni versione si installa sopra la precedente. Senza, si ripiega su
      # una chiave di debug che cambia a ogni esecuzione.
      - name: Prepara la chiave di firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KRUMIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/krumiro.jks"
            echo "KRUMIRO_KEYSTORE=$RUNNER_TEMP/krumiro.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KRUMIRO_KEYSTORE_BASE64 assente: APK firmato con una chiave di debug temporanea, non si installa sopra le versioni precedenti."
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Costruisci l'APK
        working-directory: android
        env:
          KRUMIRO_KEYSTORE_PASSWORD: ${{ secrets.KRUMIRO_KEYSTORE_PASSWORD }}
          TIPO: ${{ steps.firma.outputs.tipo }}
          VERSIONE: ${{ steps.versione.outputs.numero }}
        run: |
          if [ "$TIPO" = release ]; then
            ./gradlew assembleRelease -PversionName="$VERSIONE" -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk "../krumiro-$VERSIONE.apk"
          else
            ./gradlew assembleDebug -PversionName="$VERSIONE" -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk "../krumiro-$VERSIONE.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krumiro-apk
          path: krumiro-${{ steps.versione.outputs.numero }}.apk
      - name: Allega l'APK alla release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          cp krumiro-${{ steps.versione.outputs.numero }}.apk krumiro.apk
          gh release upload "$TAG" krumiro-${{ steps.versione.outputs.numero }}.apk krumiro.apk --clobber
